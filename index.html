<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foxxy Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#1c1c1e;--line:rgba(255,255,255,.1);--tx:#fff;--mute:#98989f;--ac:#fa2d48;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 "Inter",Roboto,Arial,Helvetica,sans-serif}
/* text can't be selected or copied anywhere in the app, only inside the search box */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input[type=search],input[type=text],textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 0 150px}
header{padding:0 20px 6px}
header small{color:var(--mute);font-size:13px}
h1{margin:2px 0 0;font-size:34px;font-weight:800;letter-spacing:-.02em}
section{margin-top:30px}
h2{margin:0 20px 12px;font-size:22px;font-weight:700;letter-spacing:-.01em}
h2 small{display:block;font-size:13px;font-weight:400;color:var(--mute);margin-top:1px}
.hs{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:0 20px;scroll-padding:0 20px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs>*{scroll-snap-align:start;flex:none}
.cv{position:relative;overflow:hidden;display:flex;align-items:flex-end}
.cv span{position:absolute;right:-6%;top:-12%;font-size:120px;font-weight:900;opacity:.16;line-height:1;letter-spacing:-.06em}
.cv.sm span{font-size:34px;right:2px;top:0}
/* Spotify-style square cards, all sections scroll sideways in one row */
.card{width:144px;display:block}
.card .cv{width:144px;height:144px;border-radius:6px}
.card .cv span{font-size:84px}
.card .lbl{width:100%;padding:26px 9px 8px;font-weight:800;font-size:15px;line-height:1.05;letter-spacing:-.01em;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0))}
.card .t{margin-top:8px;font-size:14px}
.card .m{margin-top:1px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.s,.card.s .cv{width:100px}
.card.s .cv{height:100px}
.card.s .cv span{font-size:60px}
.card.s .t{font-size:13px}
.card.alb,.card.alb .cv{width:120px}.card.alb .cv{height:120px}.card.alb .cv span{font-size:70px}   /* album covers in search results: a bit smaller than playlists */
.hs+.hs{margin-top:18px}
.card.m,.card.m .cv{width:126px}
.card.m .cv{height:126px}
.card.m .cv span{font-size:72px}
.card.m .t{font-size:13px}
/* Trending: Apple Music style columns of 4 songs */
.pg{width:min(82%,300px);display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);width:100%}
.row .cv{width:42px;height:42px;border-radius:5px;flex:none}
.row .cv span{font-size:26px}
.row .t{font-size:14px}
.row .m{font-size:12px}
.row div.in{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dots{color:var(--mute);letter-spacing:2px;font-weight:700}
.row.on .t{color:var(--ac)}
/* Recents: same row style as Trending, six songs, 2 columns x 3 rows, no side scroll */
.rg{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;padding:0 20px}
.rg .row{min-width:0;gap:10px}
.rg .row .cv{width:38px;height:38px;border-radius:4px}
.rg .row .cv span{font-size:22px}
.rg .row .t{font-size:13px}
.rg .row .m{font-size:11px}
.rg .row .dots{display:none}
/* Mix page */
.mix{position:fixed;inset:0;z-index:20;background:#000;overflow-y:auto;transform:translateY(102%);transition:transform .38s cubic-bezier(.3,.8,.3,1);visibility:hidden}
.mix.on{transform:none;visibility:visible}
.in-mix{max-width:520px;margin:0 auto;position:relative}
.hero{position:sticky;top:0;height:min(100vw,520px);z-index:0;overflow:hidden}
.hero .cv{position:absolute;inset:0;border-radius:0;will-change:transform}
.hero .cv span{font-size:340px;right:-4%;top:-6%}
.sheet{position:relative;z-index:1;margin-top:-150px;padding:150px 20px 190px;background:linear-gradient(to bottom,rgba(0,0,0,0),#000 150px)}
.sheet h2{margin:0;font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em}
.sheet .by{color:var(--mute);margin:10px 0 0}
.acts{display:flex;align-items:center;gap:20px;margin:18px 0 8px}
.acts .sp{flex:1}
.play{width:56px;height:56px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
svg{width:24px;height:24px;fill:currentColor;display:block}
.ghost{color:var(--mute)}
.bar{position:fixed;top:0;left:0;right:0;z-index:25;height:calc(env(safe-area-inset-top,0px) + 56px);padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;gap:12px;transform:translateY(-120%);transition:transform .38s}
.bar.on{transform:none}
.bar button{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(12px);display:grid;place-items:center}
.bar b{opacity:0;transition:opacity .2s}
.tr{padding:9px 0}
.tr .cv{width:50px;height:50px}
.tr .t{font-size:15px}
.tr .m{font-size:13px}
.tr .n{width:50px;height:50px}
/* mini player */
.mini{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 68px);max-width:496px;margin:0 auto;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:12px;background:rgba(44,44,46,.82);backdrop-filter:blur(24px);border:1px solid var(--line);transform:translateY(160%);transition:transform .3s}
.mini.on{transform:none}
.mini .cv{width:44px;height:44px;border-radius:5px;flex:none}
.mini .in{flex:1;min-width:0}

/* Search view merged into the home app */
.sb{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:8px 20px 12px;background:linear-gradient(#000 78%,rgba(0,0,0,0))}
.pill{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:12px;background:var(--card);color:var(--mute)}
.pill:focus-within{box-shadow:0 0 0 2px var(--ac)} .pill svg{width:20px;height:20px;flex:none}
.pill input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;appearance:none;-webkit-appearance:none}
.pill input::-webkit-search-cancel-button{display:none}.pill input::placeholder{color:var(--mute)}
#clr{width:22px;height:22px;display:grid;place-items:center}#clr svg{width:22px;height:22px}
#searchView[hidden],#homeView[hidden]{display:none!important}
.search-head{display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 4px}.search-head h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em}
.list{padding:0 20px}.list .row{padding:8px 0}.list .row .cv{width:50px;height:50px}.list .row .t{font-size:15px}.list .row .m{font-size:13px}
.search-idle section:first-child{margin-top:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding-right:20px}
.clr-link{font-size:14px;font-weight:400;color:var(--mute);padding:4px 0}
.clr-link:active{opacity:.6}
.res-count{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px;margin-top:14px}
.res-count span{font-size:13px;font-weight:400;color:var(--mute);background:rgba(255,255,255,.13);border-radius:999px;padding:4px 11px}
.res-count b{font-weight:400;color:var(--tx);margin-left:6px}
.res-count+section{margin-top:18px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:520px;margin:0 auto;display:flex;justify-content:space-around}.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;min-width:76px;font-size:11px;font-weight:600;color:var(--mute)}
.nav svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav .on{color:var(--ac)}


/* ---------- Full-screen Now Playing (Apple Music-inspired black theme) ---------- */
body.player-open{overflow:hidden}
body.player-open .app,body.player-open .nav,body.player-open .mini{display:none!important}
#playerPage{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;overscroll-behavior:contain;background:#000;color:#fff;padding:calc(env(safe-area-inset-top,0px) + 8px) 26px calc(env(safe-area-inset-bottom,0px) + 22px)}
body.player-open #playerPage{display:flex;flex-direction:column}
.pp-wrap{width:100%;max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;flex:1}
.pp-head{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pp-head button{width:42px;height:42px;display:grid;place-items:center;color:#f5f5f7}
.pp-head svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pp-head .pp-caption{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#a1a1a6}
.pp-art-wrap{flex:0 0 auto;width:100%;display:flex;align-items:center;justify-content:center;margin:4px 0 20px}
#ppArt{width:min(100%, min(78vw,430px));aspect-ratio:1;flex:none;border-radius:8px;overflow:hidden;background:#1c1c1e;box-shadow:0 18px 55px rgba(0,0,0,.55);position:relative}
#ppArt .cv{width:100%;height:100%;border-radius:0}
#ppArt .cv span{font-size:clamp(80px,28vw,180px)}
.pp-meta{display:flex;align-items:center;gap:14px;margin-top:0}
.pp-info{min-width:0;flex:1}
#ppTitle{font-size:23px;line-height:1.2;font-weight:750;letter-spacing:-.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#ppArtist{font-size:16px;color:#a1a1a6;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ppHeart{flex:none;width:44px;height:44px;display:grid;place-items:center;color:#a1a1a6}
#ppHeart svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8}
#ppHeart.on{color:#fa2d48}#ppHeart.on svg{fill:currentColor}
.pp-progress{margin-top:24px}
#ppSeek{display:block;width:100%;height:18px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}
#ppSeek::-webkit-slider-runnable-track{height:4px;border-radius:8px;background:linear-gradient(to right,#fff var(--p,0%),#424246 var(--p,0%))}
#ppSeek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;margin-top:-4px;background:#fff}
#ppSeek::-moz-range-track{height:4px;border-radius:8px;background:#424246}
#ppSeek::-moz-range-progress{height:4px;border-radius:8px;background:#fff}
#ppSeek::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.pp-time{display:flex;justify-content:space-between;color:#8e8e93;font-size:12px;font-variant-numeric:tabular-nums;margin-top:4px}
.pp-controls{display:flex;align-items:center;justify-content:space-between;margin:20px -4px 10px}
.pp-controls button{width:44px;height:54px;display:grid;place-items:center;color:#f5f5f7}
.pp-controls button svg{width:27px;height:27px;fill:currentColor}
.pp-controls button:active{opacity:.55;transform:scale(.94)}
#ppPrev svg,#ppNext svg{width:30px;height:30px}
#ppPlay{width:72px;height:72px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
#ppPlay svg{width:32px;height:32px}
#ppPlay .pp-pause{display:none}
#ppPlay.is-playing .pp-play{display:none}
#ppPlay.is-playing .pp-pause{display:block}
#ppLoop{color:#8e8e93}
#ppLoop.on{color:#fa2d48}
.pp-similar{margin-top:24px;padding:0 0 10px}.pp-similar h3{font-size:17px;margin:0 0 12px}.pp-similar-list{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}.pp-similar-row .card{flex:0 0 116px;width:116px;text-align:left}.pp-similar-row .cv{width:116px;height:116px}.pp-similar-row .t{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pp-similar-row .m{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-bottom{display:flex;justify-content:flex-end;align-items:center;margin-top:18px;padding-top:12px;color:#8e8e93;font-size:12px}
.pp-bottom span{display:flex;align-items:center;gap:6px}
.pp-bottom svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
@media(max-height:680px){
 #playerPage{padding-left:22px;padding-right:22px}
 .pp-art-wrap{margin:0 0 16px}
 #ppArt{width:min(100%, min(66vw,360px))}
 #ppTitle{font-size:20px}#ppArtist{font-size:14px}
 .pp-progress{margin-top:17px}.pp-controls{margin-top:12px}
 #ppPlay{width:64px;height:64px}
}
@media(min-width:560px){#playerPage{padding-top:28px;padding-bottom:28px}.pp-art-wrap{max-height: min(48vh,430px)}}

/* Similar Songs: reuse the legacy Foxxy recommendation flow in the full player */
.pp-similar{margin-top:24px;min-width:0}
.pp-similar h3{font-size:19px;font-weight:750;letter-spacing:-.25px;margin:0 0 12px}
.pp-similar-row{display:flex;gap:12px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pp-similar-row::-webkit-scrollbar{display:none}
.pp-similar-row .card{width:112px;flex:0 0 112px;display:block}
.pp-similar-row .card .cv{width:112px;height:112px;border-radius:7px;overflow:hidden}
.pp-similar-row .card .t{font-size:13px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-similar-row .card .m{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-similar-row .msg{display:block;color:#8e8e93;font-size:13px;padding:4px 0}
@media(max-height:680px){.pp-similar{margin-top:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .lbl{position:relative;z-index:1}
.msg{margin:22px 20px;color:var(--mute)}
.hs>.msg{margin:6px 0}
.lnk{color:var(--ac);font-weight:600}
[hidden]{display:none!important}
.card.md,.card.md .cv{width:126px}
.card.md .cv{height:126px}
.card.md .cv span{font-size:72px}
.card.md .t{font-size:13px}
.card.on .t{color:var(--ac)}
.pp-similar h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Lyrics (LRCLIB): cover page <-> lyrics card, swipe or auto-swipe when a song has lyrics ---------- */
#playerPage{--pp-side:26px;--ly-accent:#fff;--ly-ease:cubic-bezier(.33,0,.2,1);--ly-fade:.65s;overflow-x:hidden}
@media(max-height:680px){#playerPage{--pp-side:22px}}
.pp-head{position:relative}
.pp-pager{position:relative;flex:none;margin:0 calc(var(--pp-side) * -1);overflow:hidden;overflow:clip visible;touch-action:pan-y;-webkit-tap-highlight-color:transparent}   /* clip sideways only so the cover's shadow isn't cut */
.pp-pager *{touch-action:pan-y}
.pp-track{display:flex;width:100%;will-change:transform;transition:transform .55s cubic-bezier(.22,.8,.24,1)}
.pp-track.drag{transition:none}
.pp-pager.has-lyrics .pp-track{width:200%}
.pp-page{position:relative;flex:0 0 100%;min-width:0;padding:0 var(--pp-side)}
.pp-pager.has-lyrics .pp-page{flex-basis:50%}
.pp-pager:not(.has-lyrics) .pp-lyrics-page{display:none}

/* page dots (under "Now Playing"), shown only when the song has lyrics */
.ly-dots{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);display:flex;justify-content:center}
.pp-head .ly-dots button{width:26px;height:16px;padding:0;display:flex;align-items:center;justify-content:center;font-size:0;color:inherit}
.pp-head .ly-dots button::before{content:'';width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,.4);transition:width .3s ease,background .3s ease}
.pp-head .ly-dots button.on::before{width:17px;background:#fff}

/* lyrics card: same height as cover + song details, so the lyrics box is taller than the cover */
.np-card{position:absolute;top:4px;bottom:0;left:var(--pp-side);right:var(--pp-side);isolation:isolate;display:flex;flex-direction:column;overflow:hidden;border-radius:22px;box-shadow:0 22px 50px rgba(0,0,0,.34)}
.np-card::before{content:'';position:absolute;top:-24%;right:-24%;bottom:-24%;left:-24%;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.76)),var(--ly-art,none) center/cover no-repeat;background-color:#1c1c1e;filter:blur(30px) saturate(1.3);transform:translateZ(0)}
.np-card::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;z-index:6;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.np-head{flex:none;display:flex;align-items:center;gap:12px;padding:12px 12px 4px}
.np-thumb{flex:none;width:clamp(52px,7.4vh,66px);height:clamp(52px,7.4vh,66px);border-radius:12px;background:var(--ly-art,none) center/cover no-repeat rgba(255,255,255,.16);box-shadow:0 8px 20px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.14)}
.np-info{flex:1;min-width:0}
.np-title{font-weight:700;font-size:clamp(16px,2.3vh,19px);line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.np-artist{margin-top:2px;font-size:clamp(13px,1.75vh,15px);color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-heart{flex:none;width:44px;height:44px;display:grid;place-items:center;color:#a1a1a6}
.np-heart svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8}
.np-heart.on{color:#fa2d48}.np-heart.on svg{fill:currentColor}

/* lyrics area */
.ly-box{position:relative;flex:1 1 0;min-height:0;container-type:size}
.ly-scroll{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 13%,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 13%,#000 86%,transparent 100%)}
.ly-scroll::-webkit-scrollbar{display:none}
/* top / bottom room so the first and last lines can reach the resting spot (about 40% down the box) */
.ly-lines{padding:34% 20px 0 34px}
.ly-credit{padding:1em 20px 58% 34px;font-size:11px;color:rgba(255,255,255,.4)}
@supports (width:1cqw){
  .ly-lines{padding:36cqh clamp(14px,6cqw,24px) 0 clamp(30px,10cqw,40px)}
  .ly-credit{padding:1em clamp(14px,6cqw,24px) 58cqh clamp(30px,10cqw,40px)}
}
.ly-lines.plain{padding-top:56px}                                   /* un-synced lyrics read from the top */
.ly-scroll:has(.ly-lines.plain) .ly-credit{padding-bottom:28px}
.ly-lines .ly-l{position:relative;margin:0 0 .78em;font-weight:700;font-size:18px;line-height:1.32;color:#fff;opacity:.5;transform:scale(.84);transform-origin:left center;transition:opacity var(--ly-fade) var(--ly-ease),transform var(--ly-fade) var(--ly-ease);overflow-wrap:anywhere}
@supports (width:1cqw){.ly-lines .ly-l{font-size:clamp(16px,6.2cqw,25px)}}
.ly-lines .ly-l.gap{letter-spacing:.2em}
.ly-lines:not(.plain) .ly-l.on ~ .ly-l{opacity:.7}                  /* lines still to come are brighter than lines already sung */
.ly-lines .ly-l.on{opacity:1;transform:none;color:var(--ly-accent);text-shadow:0 0 18px rgba(255,255,255,.18),0 2px 12px rgba(0,0,0,.35)}
/* little equaliser beside the current line: the three bars bounce while the song plays */
.ly-lines .ly-l.on::before{content:'';position:absolute;left:-20px;top:.34em;width:11px;height:.95em;background:linear-gradient(var(--ly-accent),var(--ly-accent)) 0 100%/2px 45% no-repeat,linear-gradient(var(--ly-accent),var(--ly-accent)) 50% 100%/2px 100% no-repeat,linear-gradient(var(--ly-accent),var(--ly-accent)) 100% 100%/2px 62% no-repeat;animation:lyEq 1.15s ease-in-out infinite}
@keyframes lyEq{0%,100%{background-size:2px 45%,2px 100%,2px 62%}20%{background-size:2px 100%,2px 60%,2px 35%}40%{background-size:2px 62%,2px 92%,2px 80%}60%{background-size:2px 30%,2px 55%,2px 100%}80%{background-size:2px 85%,2px 100%,2px 50%}}
.np-card.is-paused .ly-lines .ly-l.on::before{animation-play-state:paused}     /* bars rest when the song is paused */
.ly-lines.plain .ly-l{opacity:.94;transform:none;color:#fff}         /* un-synced lyrics: plain, evenly readable */
.ly-lines.plain .ly-l.sp{height:.7em;margin:0}
/* keep the lyric animations on screens that report "reduce motion" (common on car units) */
@media (prefers-reduced-motion:reduce){
  #playerPage .pp-track:not(.drag){transition:transform .55s cubic-bezier(.22,.8,.24,1)!important}
  #playerPage .ly-lines .ly-l{transition:opacity var(--ly-fade) var(--ly-ease),transform var(--ly-fade) var(--ly-ease)!important}
}

/* Library / Playlist pages, bottom sheet, toast, sleep button */
.search-head .play{width:46px;height:46px;margin-bottom:2px}
.vsub{margin:0 20px 14px;color:var(--mute);font-size:13px}
.dots.x{padding:10px 4px}
#ppSleep{color:#8e8e93}#ppSleep.on{color:#fa2d48}
#shOv{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);backdrop-filter:blur(5px)}
#shBox{width:100%;max-width:520px;border-radius:22px 22px 0 0;background:#1c1c1e;padding:16px 0 calc(env(safe-area-inset-bottom,0px) + 12px)}
.sht{padding:0 20px 12px;text-align:center;border-bottom:1px solid var(--line)}
.sht b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sht small{display:block;margin-top:2px;color:var(--ac);font-variant-numeric:tabular-nums}
.so{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 24px;font-size:16px}
.so:disabled{opacity:.38}.so i{font-style:normal;color:var(--ac);opacity:0}.so.on{color:var(--ac)}.so.on i{opacity:1}
#tst{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translate(-50%,20px);z-index:95;max-width:86%;padding:10px 16px;border-radius:20px;background:rgba(58,58,60,.97);font-size:14px;opacity:0;pointer-events:none;transition:.25s}
#tst.show{opacity:1;transform:translate(-50%,0)}

/* song rows: smaller, light-white vertical dots (tap = Like / Add to playlist menu) */
.row .dots{writing-mode:vertical-rl;font-size:11px;font-weight:400;letter-spacing:1px;line-height:1;color:rgba(255,255,255,.72);padding:8px 14px;margin-right:-10px}
.row .dots.x{writing-mode:horizontal-tb;font-size:inherit;letter-spacing:normal;padding:10px 4px;margin-right:0;color:var(--mute)}
.ghost.on{color:var(--ac)}
.hh{display:flex;align-items:flex-end;justify-content:space-between}
#profBtn{width:40px;height:40px;border-radius:50%;background:#2c2c2e;color:#fff;display:grid;place-items:center;flex:none;margin-bottom:2px}
#profBtn svg{width:22px;height:22px;fill:currentColor}
</style>
